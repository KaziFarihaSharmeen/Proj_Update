<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<body>


<h2>Add Employee</h2>


<form action="/save" method="post"
      th:object="${employee}">


    Name:

    <input type="text" th:field="*{name}">
    <br>


    Email:

    <input type="text" th:field="*{email}">
    <br>


    Department:

    <input type="text" th:field="*{department}">
    <br>


    Salary:

    <input type="text" th:field="*{salary}">
    <br>


    <button type="submit">
        Save
    </button>


</form>


</body>


</html>
